[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dca"
version = "0.1.0"
description = "Decoupled Conditional Advantage (DCA) / Dynamic DCA (DDCA) for RL-based reasoning"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.17.0",
    "pyyaml>=5.0",
    "pandas>=1.1.0",
    "pyarrow>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=6.0"]
dev = ["pytest>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
